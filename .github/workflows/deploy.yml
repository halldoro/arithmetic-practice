name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Force JavaScript actions onto Node.js 24 instead of the deprecated Node.js 20.
# Without this, GitHub will start running Node 20 actions on Node 24 by default
# in mid-2026 anyway, but we opt in explicitly so the workflow keeps passing
# (and the deprecation noise stays out of the logs) regardless.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject git SHA into practice.html
        run: |
          short_sha="${GITHUB_SHA:0:7}"
          sed -i "s/__SHA__/${short_sha}/g" practice.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
