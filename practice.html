<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arithmetic Practice Sheets</title>
  <style>
    :root {
      --ink: #0000b8;
      --paper: #ffffff;
      --ui-bg: #f5f5f7;
      --ui-border: #d7d7df;
      --text: #1f2330;
      --muted: #626678;
      --control-bg: #ffffff;
      --shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--text);
      background: var(--ui-bg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.4;
    }

    header {
      padding: 22px 24px 8px;
      max-width: 1180px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 0.96rem;
    }

    .app {
      max-width: 1180px;
      margin: 0 auto;
      padding: 16px 24px 40px;
    }

    .controls {
      background: var(--paper);
      border: 1px solid var(--ui-border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 16px;
      margin-bottom: 22px;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(120px, 1fr));
      gap: 14px;
      align-items: end;
    }

    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 650;
      margin-bottom: 5px;
    }

    select,
    input {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--ui-border);
      background: var(--control-bg);
      color: var(--text);
      border-radius: 9px;
      padding: 7px 9px;
      font: inherit;
    }

    .button-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      min-height: 38px;
      border: 1px solid #0000a6;
      border-radius: 9px;
      padding: 7px 13px;
      background: var(--ink);
      color: white;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    button.secondary {
      background: white;
      color: var(--ink);
    }

    button:active {
      transform: translateY(1px);
    }

    .future-note {
      margin-top: 13px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .worksheet-wrap {
      display: flex;
      justify-content: center;
      overflow: auto;
      padding-bottom: 24px;
    }

    .page {
      background: var(--paper);
      box-shadow: var(--shadow);
      color: var(--ink);
      display: grid;
      gap: 2.2mm;
      padding: 2.2mm;
    }

    .page.portrait {
      width: 210mm;
      height: 297mm;
    }

    .page.landscape {
      width: 297mm;
      height: 210mm;
    }

    .problem-cell {
      border: 0.22mm solid var(--ink);
      overflow: hidden;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
      min-width: 0;
      min-height: 0;
      break-inside: avoid;
    }

    .problem-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .hidden {
      display: none !important;
    }

    .muted {
      color: var(--muted);
    }

    @media (max-width: 900px) {
      .controls-grid {
        grid-template-columns: repeat(2, minmax(140px, 1fr));
      }

      .page.portrait,
      .page.landscape {
        transform-origin: top center;
      }
    }

    @page {
      size: A4 portrait;
      margin: 0;
    }

    @media print {
      body {
        background: white;
      }

      header,
      .controls {
        display: none !important;
      }

      .app {
        padding: 0;
        max-width: none;
        margin: 0;
      }

      .worksheet-wrap {
        display: block;
        padding: 0;
        overflow: visible;
      }

      .page {
        box-shadow: none;
        margin: 0;
        page-break-after: avoid;
      }

      .page.portrait {
        width: 210mm;
        height: 297mm;
      }

      .page.landscape {
        width: 297mm;
        height: 210mm;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Arithmetic Practice Sheets</h1>
    <p class="subtitle">
      Printable arithmetic worksheets for children. This first exercise type is visual line multiplication.
    </p>
  </header>

  <main class="app">
    <section class="controls" aria-label="Worksheet controls">
      <div class="controls-grid">
        <div>
          <label for="exerciseType">Exercise type</label>
          <select id="exerciseType">
            <option value="lineMultiplication">Line multiplication</option>
            <option value="multiplicationTables" disabled>Multiplication tables — coming later</option>
            <option value="division" disabled>Division practice — coming later</option>
          </select>
        </div>

        <div>
          <label for="problemCount">Number of problems</label>
          <select id="problemCount">
            <option>1</option>
            <option>2</option>
            <option selected>3</option>
            <option>4</option>
            <option>5</option>
            <option>6</option>
            <option>7</option>
            <option>8</option>
            <option>9</option>
            <option>10</option>
            <option>11</option>
            <option>12</option>
          </select>
        </div>

        <div>
          <label for="problemType">Problem type</label>
          <select id="problemType">
            <option value="random" selected>Random 2–4 × 2–4</option>
            <option value="2x2">2 × 2 digits</option>
            <option value="2x3">2 × 3 digits</option>
            <option value="2x4">2 × 4 digits</option>
            <option value="3x2">3 × 2 digits</option>
            <option value="3x3">3 × 3 digits</option>
            <option value="3x4">3 × 4 digits</option>
            <option value="4x2">4 × 2 digits</option>
            <option value="4x3">4 × 3 digits</option>
            <option value="4x4">4 × 4 digits</option>
          </select>
        </div>

        <div>
          <label for="inkColor">Ink color</label>
          <select id="inkColor">
            <option value="#0000b8" selected>Blue</option>
            <option value="#000000">Black</option>
            <option value="#1c5d2f">Green</option>
            <option value="#7b1f1f">Red-brown</option>
          </select>
        </div>

        <div>
          <label for="seed">Seed <span class="muted">(optional)</span></label>
          <input id="seed" inputmode="numeric" placeholder="blank = random">
        </div>

        <div class="button-row">
          <button id="createBtn" type="button">Create problem set</button>
          <button id="printBtn" type="button" class="secondary">Print</button>
        </div>
      </div>

      <p class="future-note">
        Page orientation is automatic: 1–3 problems use portrait; 4–12 problems use landscape.
      </p>
    </section>

    <section class="worksheet-wrap">
      <div id="page" class="page portrait" aria-label="Printable worksheet"></div>
    </section>
  </main>

  <script>
    "use strict";

    const SVG_NS = "http://www.w3.org/2000/svg";

    function mulberry32(seed) {
      let t = seed >>> 0;
      return function rand() {
        t += 0x6D2B79F5;
        let r = Math.imul(t ^ (t >>> 15), 1 | t);
        r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
        return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
      };
    }

    function hashStringToSeed(text) {
      let h = 2166136261 >>> 0;
      for (let i = 0; i < text.length; i++) {
        h ^= text.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    }

    function randomInt(rand, min, maxInclusive) {
      return Math.floor(rand() * (maxInclusive - min + 1)) + min;
    }

    function randomNumber(rand, digits) {
      const first = String(randomInt(rand, 1, 9));
      let rest = "";
      for (let i = 1; i < digits; i++) {
        rest += String(randomInt(rand, 0, 9));
      }
      return first + rest;
    }

    function chooseDigits(rand, problemType) {
      if (problemType === "random") {
        return [randomInt(rand, 2, 4), randomInt(rand, 2, 4)];
      }

      const match = problemType.match(/^([2-4])x([2-4])$/);
      if (!match) {
        return [2, 2];
      }

      return [Number(match[1]), Number(match[2])];
    }

    function makeProblems(options, rand) {
      const problems = [];
      for (let i = 0; i < options.count; i++) {
        const [leftDigits, rightDigits] = chooseDigits(rand, options.problemType);
        problems.push({
          left: randomNumber(rand, leftDigits),
          right: randomNumber(rand, rightDigits)
        });
      }
      return problems;
    }

    function pageLayout(count) {
      if (count === 1) return { rows: 1, cols: 1, orientation: "portrait" };
      if (count === 2) return { rows: 2, cols: 1, orientation: "portrait" };
      if (count === 3) return { rows: 3, cols: 1, orientation: "portrait" };
      if (count === 4) return { rows: 2, cols: 2, orientation: "landscape" };
      if (count <= 6) return { rows: 2, cols: 3, orientation: "landscape" };
      if (count <= 8) return { rows: 2, cols: 4, orientation: "landscape" };
      if (count === 9) return { rows: 3, cols: 3, orientation: "landscape" };
      return { rows: 3, cols: 4, orientation: "landscape" };
    }

    function svgEl(tag, attrs = {}, parent = null) {
      const el = document.createElementNS(SVG_NS, tag);
      for (const [key, value] of Object.entries(attrs)) {
        el.setAttribute(key, String(value));
      }
      if (parent) parent.appendChild(el);
      return el;
    }

    function addText(parent, text, x, y, attrs = {}) {
      const el = svgEl("text", {
        x,
        y,
        "font-family": "serif",
        "dominant-baseline": "middle",
        ...attrs
      }, parent);
      el.textContent = text;
      return el;
    }

    function visualRows(m, n) {
      const rows = [];
      for (let d = m - 1; d >= -n + 1; d--) {
        const row = [];
        for (let i = 0; i < m; i++) {
          for (let j = 0; j < n; j++) {
            if (i - j === d) {
              row.push([i, j]);
            }
          }
        }
        row.sort((a, b) => (a[0] + a[1]) - (b[0] + b[1]));
        rows.push(row);
      }
      return rows;
    }

    function renderLineMultiplication(problem, options) {
      const leftDigits = [...problem.left];
      const rightDigits = [...problem.right];
      const m = leftDigits.length;
      const n = rightDigits.length;
      const ink = options.inkColor;

      const svg = svgEl("svg", {
        class: "problem-svg",
        viewBox: "0 0 1000 620",
        preserveAspectRatio: "xMidYMid meet",
        role: "img",
        "aria-label": `${problem.left} times ${problem.right}`
      });

      const titleGroup = svgEl("g", {}, svg);
      addText(titleGroup, `${problem.left} × ${problem.right}`, 42, 62, {
        fill: ink,
        "font-size": 42
      });

      const gridGroup = svgEl("g", {
        transform: "translate(255 330)"
      }, svg);

      const sep = 74;
      const margin = 30;
      const labelOffset = 34;
      const rt = Math.SQRT1_2;

      function pt(u, v) {
        return {
          x: (u + v) * rt,
          y: (v - u) * rt
        };
      }

      const uMin = -margin;
      const uMax = (n - 1) * sep + margin;
      const vMin = -margin;
      const vMax = (m - 1) * sep + margin;

      function drawLine(p1, p2) {
        svgEl("line", {
          x1: p1.x,
          y1: p1.y,
          x2: p2.x,
          y2: p2.y,
          stroke: ink,
          "stroke-width": 4.2,
          "stroke-linecap": "round"
        }, gridGroup);
      }

      for (let i = 0; i < m; i++) {
        const v = i * sep;
        drawLine(pt(uMin, v), pt(uMax, v));
      }

      for (let j = 0; j < n; j++) {
        const u = j * sep;
        drawLine(pt(u, vMin), pt(u, vMax));
      }

      for (let i = 0; i < m; i++) {
        const v = i * sep;
        for (let j = 0; j < n; j++) {
          const u = j * sep;
          const p = pt(u, v);
          svgEl("circle", {
            cx: p.x,
            cy: p.y,
            r: 10.5,
            fill: ink
          }, gridGroup);
        }
      }

      for (let i = 0; i < m; i++) {
        const v = i * sep;
        const p = pt(uMin - labelOffset, v);
        addText(gridGroup, leftDigits[i], p.x, p.y, {
          fill: ink,
          "font-size": 39,
          "text-anchor": "end"
        });
      }

      for (let j = 0; j < n; j++) {
        const u = j * sep;
        const p = pt(u, vMin - labelOffset);
        addText(gridGroup, rightDigits[j], p.x, p.y, {
          fill: ink,
          "font-size": 39,
          "text-anchor": "middle"
        });
      }

      const boxesGroup = svgEl("g", {
        transform: "translate(590 280)"
      }, svg);

      drawMathBoxes(boxesGroup, m, n, ink);

      return svg;
    }

    function drawMathBoxes(parent, m, n, ink) {
      const rows = visualRows(m, n);

      const square = 48;
      const gap = 8;
      const squareStep = square + gap / 2;
      const rowStep = square + gap;

      const allX = [];
      for (const row of rows) {
        for (const [i, j] of row) {
          allX.push(i + j);
        }
      }

      const minX = Math.min(...allX);
      const maxX = Math.max(...allX);
      const totalWidth = (maxX - minX) * squareStep + 2 * square;
      const totalHeight = (rows.length - 1) * rowStep + square;

      const offsetX = -totalWidth / 2;
      const offsetY = -totalHeight / 2;

      function pieceAt(x, y) {
        svgEl("rect", {
          x,
          y,
          width: 2 * square,
          height: square,
          fill: "white",
          stroke: ink,
          "stroke-width": 3.2
        }, parent);

        svgEl("line", {
          x1: x + square,
          y1: y,
          x2: x + square,
          y2: y + square,
          stroke: ink,
          "stroke-width": 3.2
        }, parent);
      }

      for (let rowIndex = 0; rowIndex < rows.length; rowIndex++) {
        const y = offsetY + rowIndex * rowStep;
        for (const [i, j] of rows[rowIndex]) {
          // Mirror the horizontal coordinate so the box image has the
          // same left/right lean as the line-intersection grid.
          //
          // The grid's visible horizontal coordinate is proportional to i+j,
          // but SVG's box anchors grow to the right. Using maxX - (i+j)
          // keeps the brick rows snapped to the square grid while matching
          // the orientation of the circle pattern.
          const xIndex = maxX - (i + j);
          const x = offsetX + (xIndex - minX) * squareStep;
          pieceAt(x, y);
        }
      }
    }

    const exerciseTypes = {
      lineMultiplication: {
        label: "Line multiplication",
        makeProblems,
        renderProblem: renderLineMultiplication
      }
    };

    function readOptions() {
      return {
        exerciseType: document.getElementById("exerciseType").value,
        count: Number(document.getElementById("problemCount").value),
        problemType: document.getElementById("problemType").value,
        inkColor: document.getElementById("inkColor").value,
        seedText: document.getElementById("seed").value.trim()
      };
    }

    function createProblemSet() {
      const options = readOptions();
      const page = document.getElementById("page");
      const layout = pageLayout(options.count);

      page.className = `page ${layout.orientation}`;
      page.style.gridTemplateColumns = `repeat(${layout.cols}, 1fr)`;
      page.style.gridTemplateRows = `repeat(${layout.rows}, 1fr)`;
      page.innerHTML = "";

      const seed = options.seedText
        ? hashStringToSeed(options.seedText)
        : Math.floor(Math.random() * 0xffffffff);

      const rand = mulberry32(seed);
      const generator = exerciseTypes[options.exerciseType];
      const problems = generator.makeProblems(options, rand);

      for (let i = 0; i < layout.rows * layout.cols; i++) {
        const cell = document.createElement("div");
        cell.className = "problem-cell";
        page.appendChild(cell);

        if (i < problems.length) {
          const svg = generator.renderProblem(problems[i], options);
          cell.appendChild(svg);
        } else {
          cell.classList.add("hidden");
        }
      }

      setPrintOrientation(layout.orientation);
    }

    function setPrintOrientation(orientation) {
      let style = document.getElementById("dynamicPrintPageStyle");
      if (!style) {
        style = document.createElement("style");
        style.id = "dynamicPrintPageStyle";
        document.head.appendChild(style);
      }

      style.textContent = `
        @page {
          size: A4 ${orientation};
          margin: 0;
        }
      `;
    }

    document.getElementById("createBtn").addEventListener("click", createProblemSet);
    document.getElementById("printBtn").addEventListener("click", () => window.print());

    createProblemSet();
  </script>
</body>
</html>
